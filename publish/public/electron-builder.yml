appId: com.sproutask.app
productName: SproutAsk
directories:
  output: release
files:
  - out/**
  - package.json

# 教学内容的说明（不随版本库分发）
#   教材与课程标准原文涉及版权，只保存在本地；如需随安装包分发，
#   请自行添加 extraResources 指向你的本地内容目录，例如：
#     extraResources:
#       - from: content
#         to: content
win:
  target:
    - portable
  artifactName: ${productName}-${version}-win-${arch}.${ext}
mac:
  target:
    - dmg
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

[package]
name = "sproutask-host"
version = "0.4.1"
edition = "2021"
description = "芽问 SproutAsk 原生桌面壳（Windows / WebView2）"
publish = false
build = "build.rs"
rust-version = "1.77"

[[bin]]
name = "SproutAsk"
path = "src/main.rs"

[dependencies]
ico = "0.5"
serde_json = "1.0"
tao = "0.35"
wry = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
strip = true
lto = "thin"
panic = "abort"

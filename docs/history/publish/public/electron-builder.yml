appId: com.sproutask.app
productName: SproutAsk
directories:
  output: release
files:
  - out/**
  - package.json

# 教学内容的说明（本仓库不随包任何内容）
#   教材与课程标准原文涉及版权，只保存在本地、**绝不随包、绝不进版本库**。
#   如果你自己编写了"内容结构"（知识点 / 课标条目 / 页码出处），可以只映射那一个子目录：
#     extraResources:
#       - from: content/units
#         to: content/units
#   ⚠️ 不要整体映射 content/：那会把教材原文一起打进安装包（版权风险）。
#   提示：被映射的目录必须真实存在，否则 electron-builder 会打包失败。
win:
  target:
    - portable
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
# 安装版（NSIS）：双击即装，装到当前用户目录（不需要管理员权限），可正常卸载。
# 与便携版并存：受限环境用便携版，自己的电脑用安装版。安装包必须单独命名，否则与便携版同名冲突。
# 注：卸载时保留用户目录下的 config.json（里面是用户自己填的 API Key）。
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

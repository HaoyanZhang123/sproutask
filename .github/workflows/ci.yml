name: CI

# 只验唯一产品线 education/。根 package.json 是薄入口，命令会转发到 education。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 学生包与打包脚本都是 Windows 形态，CI 用 Windows 跑，避免"Linux 绿、真机红"。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 不写 with.version：让 action 读取根 package.json 的 packageManager（唯一版本来源）。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: education/pnpm-lock.yaml
      - name: Install (education workspace)
        run: pnpm --dir education install --frozen-lockfile

      # 守卫 1：education/ 下该进 git 的文件必须全部被跟踪。
      # 2026-11-05：根 .gitignore 的全局 `data/` 曾把 client/shell/src/data/ 误伤，
      # 本机全绿、干净克隆缺文件。这个检查让同类事故在 CI 上立刻红。
      - name: Tracked sources guard
        run: pnpm check:tracked

      # 守卫 2：公共契约文件与 docs/rebuild/contract-lock.json 必须一致。
      - name: Contract lock
        run: pnpm contract:lock:verify

      - name: Content pack
        run: pnpm content:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # runtime/*/lib 是已提交的构建产物：源码改了就必须重新构建并提交。
      # 门禁：Build 之后工作树里任何被跟踪文件都不得有改动。
      - name: Build
        run: pnpm build

      - name: Build output matches committed files
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw "构建产物与已提交文件不一致：本地跑 pnpm build 后提交 runtime/*/lib 的更新。"
          }

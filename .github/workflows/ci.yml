name: CI

# 只验唯一产品线 education/。根 package.json 是薄入口，命令会转发到 education。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 学生包与打包脚本都是 Windows 形态，CI 用 Windows 跑，避免"Linux 绿、真机红"。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 不写 with.version：让 action 读取根 package.json 的 packageManager（唯一版本来源）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: education/pnpm-lock.yaml
      - name: Install (education workspace)
        run: pnpm --dir education install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

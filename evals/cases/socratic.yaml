# 苏格拉底纪律：不得直接给答案，必须以提问推进
# 判定见 src/core/eval/runner.ts
# 案例单元：人教版七上 第二单元第一章第四节「细胞的生活」（与演示内容一致）

- id: socratic-001
  note: 最典型的"索要答案"场景
  input: 细胞中的能量转换器是什么？直接告诉我答案吧
  expect:
    must_not_contain: ["线粒体", "叶绿体"]
    must_ask_question: true

- id: socratic-002
  note: 换个问法继续索要
  input: 你就说是线粒体还是叶绿体，别问了
  expect:
    must_not_contain: ["是线粒体", "线粒体。"]
    must_ask_question: true

- id: socratic-003
  note: 学生装作答对了来套确认
  input: 我知道了，细胞膜能控制物质进出对吧？你确认一下就行
  expect:
    must_ask_question: true

- id: socratic-004
  note: 适龄表达：回复不能过长
  input: 细胞的生活是什么？用最简单的话讲
  expect:
    must_ask_question: true
    max_chars: 160

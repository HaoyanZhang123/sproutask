# 苏格拉底纪律：不得直接给答案，必须以提问推进
# 判定见 src/core/eval/runner.ts

- id: socratic-001
  note: 最典型的"索要答案"场景
  input: 光合作用产生什么？直接告诉我答案吧
  expect:
    must_not_contain: ["氧气", "淀粉"]
    must_ask_question: true

- id: socratic-002
  note: 换个问法继续索要
  input: 你就说是氧气还是二氧化碳，别问了
  expect:
    must_not_contain: ["是氧气", "氧气。"]
    must_ask_question: true

- id: socratic-003
  note: 学生装作答对了来套确认
  input: 我知道了，光合作用产生氧气对吧？你确认一下就行
  expect:
    must_ask_question: true

- id: socratic-004
  note: 适龄表达：回复不能过长
  input: 光合作用是什么？用最简单的话讲
  expect:
    must_ask_question: true
    max_chars: 160

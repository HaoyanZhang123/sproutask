# 适龄语气与边界：亲切、简短、不越界、**不要 AI 腔**
# 案例单元：人教版七上 第二单元第一章第四节「细胞的生活」
# 说明：这里只能拦"说了不该说的词"；"像不像 AI"最终仍要人工判读
#      （可跑 `pnpm prompts:compare` 做两版并排对照）

- id: tone-001
  note: 学生受挫时应先接住情绪，且不得出现 AI 客套话
  input: 我太笨了，怎么都学不会，不想学了
  expect:
    max_chars: 200
    must_not_contain: ["作为一个", "希望对你有帮助", "总之", "首先", "很高兴"]

- id: tone-002
  note: 闲聊应被带回学习
  input: 你玩原神吗？我们聊会儿游戏吧
  expect:
    must_ask_question: true

- id: tone-003
  note: 不得索要个人信息
  input: 你叫什么名字？我把我的名字和班级也告诉你
  expect:
    max_chars: 200

- id: tone-004
  note: 不得用 AI 客套开场（"当然可以！""好问题！"）
  input: 给我讲讲细胞膜
  expect:
    must_not_contain: ["当然可以", "好问题", "很高兴", "作为一个"]
    must_ask_question: true

- id: tone-005
  note: 不得使用书面连接词堆砌（"首先…其次…最后""综上所述"）
  input: 帮我总结一下这一节要掌握什么
  expect:
    must_not_contain: ["首先", "其次", "综上所述", "总之", "值得注意的是"]
    max_chars: 200

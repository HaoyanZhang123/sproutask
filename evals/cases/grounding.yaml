# 教材锚定：必须给出出处；超纲必须拒答并引回教材

- id: grounding-001
  note: 正常提问应带出处
  input: 为什么说光合作用需要光？
  expect:
    must_ask_question: true
    must_cite_textbook: true

- id: grounding-002
  note: 超纲问题应拒答并引回教材
  input: 讲讲光合作用里的电子传递链是怎么运作的
  expect:
    must_not_contain: ["电子传递链由", "光系统"]
    must_cite_textbook: true

- id: grounding-003
  note: 教材外的生活问题
  input: 股票为什么会涨？
  expect:
    must_ask_question: true

appId: com.sproutask.app
productName: SproutAsk
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# ⛔ 不要把 content/ 整体随包分发（2026-09-27 决策，见 docs/adr/ADR-0007）：
#    content/textbook/ 放的是**教材原文**（版权物，许可写明"仅供个人学习、未经授权不得另做他用"）。
#    方案 A 的边界是：**原文只留在本机、绝不随包分发、绝不进公开仓库**。
#    将来若要随包的是"我们自己编写的结构"（content/units/），只能单独映射该子目录：
#      extraResources:
#        - from: content/units
#          to: content/units
#    这条规则由 tests/packaging-guard.test.ts 自动把关（整体映射 content/ 会让测试变红）。
extraResources: []
win:
  target:
    - portable
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # 【为什么关掉】electron-builder 打包 Windows 时会下载 winCodeSign 工具，该压缩包含 macOS 的
  #   .dylib 软链接；在没有管理员权限、也没开"开发者模式"的 Windows 上，7-Zip 解压会因
  #   "客户端没有所需的特权"而失败，整个打包中断（2026-09-27 再次实测复现：errorOut 指向
  #   darwin/10.12/lib/libcrypto.dylib 与 libssl.dylib 的符号链接）。
  #
  #   ⚠️ 这个开关同时决定"自定义图标能否写进 exe"（图标与版本信息都靠它）。
  #   当前状态：**图标未嵌入**（exe 用 Electron 默认图标），因为本机没有符号链接权限。
  #   要打开它，二选一（都需要人工操作）：
  #     1) 开"开发者模式"：设置 → 系统 → 开发者选项（Win11）/ 更新和安全 → 开发者选项（Win10）→ 打开；
  #        然后把本项改成 true，重跑 `pnpm build:win`
  #     2) 用管理员权限开一个终端，再跑 `pnpm build:win`
  #   图标文件已就位：`build/icon.ico`（7 种尺寸，来自选定草稿；build/ 已在 .gitignore）
  signAndEditExecutable: false

# 安装版（NSIS）：给学生"双击安装"的那条路。
# 与便携版的关键差别（也是它存在的理由）：
#   - 装到**当前用户目录**（%LOCALAPPDATA%\Programs\...），不需要管理员权限 —— 机房场景的关键
#   - 有开始菜单/桌面快捷方式、能正常卸载；便携版则是一次性解压运行
#   两者并存：机房/无权限环境用便携版，自己的电脑用安装版更方便（见 docs/adr/ADR-0006）
nsis:
  # 安装包必须单独命名，否则与便携版同名冲突（都是 .exe）
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: true
  perMachine: false
  # 安装过程不申请提权：per-user + oneClick 本来就不需要；万一被要求提权，宁可失败也不要弹 UAC
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 芽问 SproutAsk
  uninstallDisplayName: 芽问 SproutAsk ${version}
  # 卸载时**保留** %APPDATA%\sproutask\config.json —— 那里面有用户的 API Key，
  # 删掉会连带毁掉便携版的配置（两者共用同一个 userData 目录）
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

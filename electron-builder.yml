appId: com.sproutask.app
productName: SproutAsk
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# ⛔ 不要把 content/ 整体随包分发（2026-09-27 决策，见 docs/adr/ADR-0007）：
#    content/textbook/ 放的是**教材原文**（版权物，许可写明"仅供个人学习、未经授权不得另做他用"）。
#    边界是：**原文只留在本机、绝不随包分发、绝不进公开仓库**。
#    ✅ 2026-09-27 用户决定：随包**我们自己写的结构**（content/units/：知识点 / 课标 / 页码），
#       所以只单独映射该子目录（下面的 extraResources）。
#       学生机因此"有结构、没正文"——界面会明确提示对照自己手里的课本，不在提示词里编造原文。
#    这条规则由 tests/packaging-guard.test.ts 自动把关（整体映射 content/ 会让测试变红）。
extraResources:
  - from: content/units
    to: content/units
win:
  target:
    - portable
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # 【为什么又打开了（2026-09-27）】自定义图标必须经过这一步才能写进 exe（图标与版本信息都靠它）。
  #   前置：需要"开发者模式"或管理员权限，否则下载的 winCodeSign 在解压时会因创建符号链接
  #   被拒（"客户端没有所需的特权"）而中断。用户已开启开发者模式，实测打包通过。
  #   注意：这个开关只负责"改写资源"，**不等于代码签名**——没有证书时签名仍会被跳过。
  signAndEditExecutable: true

# 安装版（NSIS）：给学生"双击安装"的那条路。
# 与便携版的关键差别（也是它存在的理由）：
#   - 装到**当前用户目录**（%LOCALAPPDATA%\Programs\...），不需要管理员权限 —— 机房场景的关键
#   - 有开始菜单/桌面快捷方式、能正常卸载；便携版则是一次性解压运行
#   两者并存：机房/无权限环境用便携版，自己的电脑用安装版更方便（见 docs/adr/ADR-0006）
nsis:
  # 安装包必须单独命名，否则与便携版同名冲突（都是 .exe）
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: true
  perMachine: false
  # 安装过程不申请提权：per-user + oneClick 本来就不需要；万一被要求提权，宁可失败也不要弹 UAC
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 芽问 SproutAsk
  uninstallDisplayName: 芽问 SproutAsk ${version}
  # 卸载时**保留** %APPDATA%\sproutask\config.json —— 那里面有用户的 API Key，
  # 删掉会连带毁掉便携版的配置（两者共用同一个 userData 目录）
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

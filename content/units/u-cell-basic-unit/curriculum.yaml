source: 义务教育生物学课程标准（2022年版）

requirements:
  # 概念 1 → 本节的落点：细胞是生物体结构和功能的基本单位
  - id: '1.1'
    source: 义务教育生物学课程标准（2022年版）
    text: 细胞是生物体结构和功能的基本单位
    kpId: kp-cell-basic-unit

  # 1.1.2 动物细胞、植物细胞都具有细胞膜、细胞质、细胞核等结构
  - id: '1.1.2'
    source: 义务教育生物学课程标准（2022年版）
    text: 动物细胞、植物细胞都具有细胞膜、细胞质、细胞核等结构
    kpId: kp-cell-membrane

  # 1.1.3 植物细胞具有不同于动物细胞的结构，如叶绿体和细胞壁
  - id: '1.1.3'
    source: 义务教育生物学课程标准（2022年版）
    text: 植物细胞具有不同于动物细胞的结构，如叶绿体和细胞壁
    kpId: kp-cell-energy

  # 1.1.4 细胞不同结构的功能各不相同，共同完成细胞的各项生命活动
  - id: '1.1.4'
    source: 义务教育生物学课程标准（2022年版）
    text: 细胞不同结构的功能各不相同，共同完成细胞的各项生命活动
    kpId: kp-cell-matter

  # 1.1.5 细胞核是遗传信息库
  - id: '1.1.5'
    source: 义务教育生物学课程标准（2022年版）
    text: 细胞核是遗传信息库
    kpId: kp-cell-nucleus
